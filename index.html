<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер тренировок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Трекер тренировок</h1>
        <div id="activeWorkout" class="active-workout" hidden></div>
    </header>

    <main class="container">
        <div id="message" class="message" role="status" hidden></div>

        <section id="workoutSection">
            <h2>Тренировки</h2>

            <form id="workoutForm" class="workout-form" novalidate>
                <label for="workoutName">Название</label>
                <input type="text" id="workoutName" maxlength="60" placeholder="Например: Ноги и плечи">

                <label for="workoutDate">Дата</label>
                <input type="date" id="workoutDate">

                <div class="form-buttons">
                    <button type="submit" id="saveWorkoutBtn">Сохранить</button>
                    <button type="button" id="startWorkoutBtn">Начать</button>
                    <button type="button" id="cancelEditBtn" class="secondary" hidden>Не изменять</button>
                </div>
            </form>

            <h3>Запланированные тренировки</h3>
            <ul id="workoutList" class="workout-list"></ul>
            <p id="workoutListEmpty" class="hint">Пока нет запланированных тренировок.</p>
        </section>

        <section id="catalogSection">
            <h2>Справочник упражнений</h2>
            <div id="exerciseCatalog"></div>
        </section>
    </main>

    <footer class="page-footer">
        <p id="storageStatus"></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
